<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #28a745; margin-bottom: 10px; }
        p { color: #555; margin-bottom: 25px; }
        .btn-logout { background-color: #dc3545; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; }
        .btn-logout:hover { background-color: #c82333; }
    </style>
</head>
<body>
    <div class="card">
        <!-- Flask will replace {{ username }} with the actual name from your database! -->
        <h1>Welcome, {{ username }}!</h1>
        <p>You have successfully logged in.</p>
        <a href="/logout" class="btn-logout">Logout</a>
    </div>
</body>
</html>
