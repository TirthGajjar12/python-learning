<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}My site{% endblock %}</title>
</head>
<body>
    <header>
        <h1>Welcome to my site</h1>
        <nav>
            <a href="/home">Home</a>
        </nav>
    </header>
    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <ul style="color: aqua;">
        {% for msg in messages %}
        <li> {{ msg }}</li>
    {% endfor %}
    </ul>
    {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</body>
</html>
