<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}Document{% endblock %}</title>
    <style>
        body {font-family: 'Courier New', Courier, monospace; padding: 20px; background: #f5f5f5;}
        header, footer {background:#333 ; padding: 10px; color: white;}
        nav a {margin:0 10px; color: white; text-decoration: none;}
        main {
            background: white; padding: 20px; margin-top: 20px; border-radius: 5px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Feedback page</h1>
        <nav>
            <a href="/feedback">Feedback</a>
        </nav>
    </header>
    <main>
        {% block content %} {% endblock %}
    </main>
    <footer>
        <p>
            &copy;2026 Softvan
        </p>
    </footer>
</body>
</html>
